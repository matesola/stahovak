# Xcode projekt se generuje z tohoto souboru:  brew install xcodegen && xcodegen
name: Stahovak
options:
  bundleIdPrefix: cz.matesola
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 9Q57XU3JQN
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Stahovak:
    type: application
    platform: iOS
    sources:
      - Stahovak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.matesola.stahovak.ios
        PRODUCT_NAME: Stahovak
        INFOPLIST_KEY_CFBundleDisplayName: Stahovák
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Stahovak/Info.plist
      properties:
        CFBundleDisplayName: Stahovák
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: Stahovák ukládá stažená videa do Fotek.
        NSLocalNetworkUsageDescription: Stahovák se připojuje ke Stahováku na tvém Macu, který stahuje YouTube.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: cz.matesola.stahovak
            CFBundleURLSchemes:
              - stahovak
